<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fish Tank</title>
  <style>
    /* Placeholder until the real animated tank is built: shows every saved fish. */
    body { margin: 0; min-height: 100vh; font-family: 'Trebuchet MS', system-ui, sans-serif;
           background: linear-gradient(#5fc4e0, #1b6f9c); color: #fff; }
    h1 { text-align: center; margin: 0; padding: 24px 16px 4px; }
    p.note { text-align: center; margin: 0 0 16px; opacity: .85; }
    .grid { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 16px; }
    figure { margin: 0; text-align: center; }
    figure img { max-width: 220px; max-height: 140px; display: block; margin: 0 auto 6px; }
    figcaption b { display: block; font-size: 20px; }
  </style>
</head>
<body>
  <h1>🐠 The Tank</h1>
  <p class="note">Placeholder: the swimming tank comes next. <span id="count"></span></p>
  <div class="grid" id="grid"></div>
  <script>
    async function refresh() {
      const fish = await fetch('/api/fish').then((r) => r.json()).catch(() => []);
      document.getElementById('count').textContent = `${fish.length} fish so far.`;
      const grid = document.getElementById('grid');
      grid.replaceChildren(...fish.map((f) => {
        const fig = document.createElement('figure');
        const img = document.createElement('img');
        img.src = f.image; img.alt = `${f.name}'s fish`;
        const cap = document.createElement('figcaption');
        const b = document.createElement('b'); b.textContent = f.name;
        cap.append(b, f.message);
        fig.append(img, cap);
        return fig;
      }));
    }
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>

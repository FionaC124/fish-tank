<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fish Tank</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐠</text></svg>">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="tank-scene.css">
  <link rel="stylesheet" href="tank.css">
</head>
<body>
  <div class="tank" id="tank"></div>
  <div class="labels" id="labels"></div>

  <!-- "fee just dropped in!" -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- Little paper tag in the corner -->
  <div class="tag" id="tag">
    <span class="tag-title">café fish tank</span>
    <span class="tag-count"><b id="fishCount">0</b> <span id="fishWord">fish</span> swimming · draw yours at the door</span>
  </div>

  <!-- Host menu: appears when the mouse moves -->
  <div class="host" id="host">
    <div class="host-menu" id="hostMenu" hidden>
      <button type="button" id="fullscreenBtn">full screen</button>
      <button type="button" id="snapshotBtn">save a snapshot</button>
      <button type="button" id="recordBtn">record 15 seconds</button>
      <button type="button" id="removeBtn" aria-pressed="false">remove a fish…</button>
      <button type="button" id="tagBtn" aria-pressed="true">show corner tag</button>
    </div>
    <button class="host-toggle" id="hostToggle" type="button" aria-label="Host menu" aria-expanded="false">⋯</button>
  </div>
  <div class="status" id="status" hidden></div>

  <script src="tank-scene.js"></script>
  <script src="tank.js"></script>
</body>
</html>
